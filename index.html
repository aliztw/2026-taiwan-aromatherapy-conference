        /* 動畫效果 */

        .animate-shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);

    <script>
        // --- Data & Constants ---
        const EXHIBITION_DATA = [
            { id: 'prologue', title: "光影序章", subtitle: "五行 x 靈數 x 體質", tag: "前導區域", color: "text-white", bgGradient: "from-stone-900 via-stone-800 to-stone-950", imageUrl: "https://images.unsplash.com/photo-1518066000714-58c45f1a2c0a?auto=format&fit=crop&w=1200&q=80" },
            { id: 'wood', title: "木 · 生發之力", subtitle: "木之眼力｜文字尋找", tag: "木之展區", color: "text-emerald-100", bgGradient: "from-el-wood to-emerald-800", imageUrl: "https://img.shoplineapp.com/media/image_clips/6939a3813f52684d32c66f3b/original.jpg" },
            { id: 'fire', title: "火 · 熱情之光", subtitle: "心之明辨｜數字反應", tag: "火之展區", color: "text-orange-100", bgGradient: "from-el-fire to-red-900", imageUrl: "https://img.shoplineapp.com/media/image_clips/6939a3872d2bf66a426ce590/original.jpg" },
            { id: 'earth', title: "土 · 穩定之基", subtitle: "土之穩行｜指尖走線", tag: "土之展區", color: "text-yellow-100", bgGradient: "from-el-earth to-amber-900", imageUrl: "https://images.unsplash.com/photo-1465056836041-7f43ac27dcb5?auto=format&fit=crop&w=800&q=80" },
            { id: 'metal', title: "金 · 收斂之質", subtitle: "金之綿長｜出一口氣", tag: "金之展區", color: "text-yellow-100", bgGradient: "from-el-metal to-amber-800", imageUrl: "https://img.shoplineapp.com/media/image_clips/6939a3961e5e75d00618cd98/original.jpg" },
            { id: 'water', title: "水 · 流動之韻", subtitle: "水之定力｜金雞獨立", tag: "水之展區", color: "text-blue-100", bgGradient: "from-el-water to-blue-900", imageUrl: "https://img.shoplineapp.com/media/image_clips/6939a39d6dc52d7639694521/original.jpg" }
        ];

        const ELEMENT_MAPPING = {
            1: { element: "木", constitution: "氣鬱x血瘀", title: "開創者", desc: "你是超級行動派，敢冒險、不服輸的開創先鋒。", color: "bg-el-wood", hex: "#8b934e", darkHex: "#5d6335", partner: { comp: "火", compDesc: "創意會被他的熱情點亮", conflict: "土", conflictDesc: "你的點子太多，他步調跟不上" } },
            2: { element: "水", constitution: "陽虛x特稟", title: "協調者", desc: "你是細膩的傾聽者，擅長在人際中成為潤滑劑。", color: "bg-el-water", hex: "#589da9", darkHex: "#3b6971", partner: { comp: "木", compDesc: "直覺在靈感中再次流動", conflict: "火", conflictDesc: "你的冷靜，讓他熱情澆熄" } },
            3: { element: "火", constitution: "陰虛x濕熱", title: "行動家", desc: "你用熱情點亮世界，擁有點燃氣氛的感染力。", color: "bg-el-fire", hex: "#943425", darkHex: "#632318", partner: { comp: "土", compDesc: "衝勁能在他的穩定中落地", conflict: "金", conflictDesc: "熱情太旺，他需要時間消化" } },
            4: { element: "土", constitution: "氣虛x痰濕", title: "穩固者", desc: "你是注重細節、務實可靠，能把理想落地的人。", color: "bg-el-earth", hex: "#865f41", darkHex: "#5a402c", partner: { comp: "金", compDesc: "務實會被他的調理放大", conflict: "水", conflictDesc: "關懷過滿，反而讓他喘不過氣" } },
            5: { element: "火", constitution: "陰虛x濕熱", title: "探索者", desc: "你對新鮮事物充滿好奇，勇於打破框架前行。", color: "bg-el-fire", hex: "#943425", darkHex: "#632318", partner: { comp: "土", compDesc: "衝勁能在他的穩定中落地", conflict: "金", conflictDesc: "熱情太旺，他需要時間消化" } },
            6: { element: "土", constitution: "氣虛x痰濕", title: "照顧者", desc: "你樂於照顧他人，是溫暖又包容的療癒存在。", color: "bg-el-earth", hex: "#865f41", darkHex: "#5a402c", partner: { comp: "金", compDesc: "務實會被他的調理放大", conflict: "水", conflictDesc: "關懷過滿，反而讓他喘過氣" } },
            7: { element: "金", constitution: "氣虛x特稟", title: "思考者", desc: "你善於冷靜分析與探索真理，是天生的洞察者。", color: "bg-el-metal", hex: "#deab47", darkHex: "#9e7a32", partner: { comp: "水", compDesc: "理性在柔軟裡變得圓融", conflict: "木", conflictDesc: "標準太高，讓他創意難伸展" } },
            8: { element: "金", constitution: "氣虛x特稟", title: "實踐者", desc: "你是統籌全局，化理想為現實的執行高手。", color: "bg-el-metal", hex: "#deab47", darkHex: "#9e7a32", partner: { comp: "水", compDesc: "理性在柔軟裡變得圓融", conflict: "木", conflictDesc: "標準太高，讓他創意難伸展" } },
            9: { element: "水", constitution: "陽虛x特稟", title: "奉獻者", desc: "你有強烈的使命感，願為世界付出與療癒他人。", color: "bg-el-water", hex: "#589da9", darkHex: "#3b6971", partner: { comp: "木", compDesc: "直覺在靈感中再次流動", conflict: "火", conflictDesc: "冷靜過深，讓熱情澆熄" } }
        };

        const LOGO_URL = "https://img.shoplineapp.com/media/image_clips/693fd310ce43e58dabfdaa56/original.png";
        let currentResult = null;

        // --- Core Functions ---

        window.scrollToSection = (id) => {
            document.getElementById('mobile-menu').classList.add('hidden');
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
        };

        window.calculateElement = () => {
            const y = document.getElementById('year-select').value;
            const m = document.getElementById('month-select').value;
            const d = document.getElementById('day-select').value;
            if (!y || !m || !d) { alert("請完整選擇出生日期"); return; }
            
            let sum = 0;
            const fullStr = y + m + d;
            for (let char of fullStr) sum += parseInt(char);
            while (sum > 9) {
                let temp = 0;
                String(sum).split('').forEach(n => temp += parseInt(n));
                sum = temp;
            }
            
            currentResult = { ...ELEMENT_MAPPING[sum], number: sum };
            renderResult(sum, currentResult);
            incrementParticipant();
        };

        function renderResult(number, data) {
            document.getElementById('result-placeholder').classList.add('hidden');
            const content = document.getElementById('result-content');
            content.classList.remove('hidden');
            
            content.innerHTML = `
                <div class="w-full flex flex-col justify-between animate-fade-in-up">
                    <div class="relative w-full max-w-[340px] mx-auto ${data.color} text-white rounded-[24px] shadow-2xl p-8 flex flex-col items-center">
                        <img src="${LOGO_URL}" class="h-8 brightness-0 invert mb-4">
                        <div class="text-xs tracking-widest opacity-80 mb-6 uppercase">2026 臺灣精油芳療年會</div>
                        <div class="bg-white/10 px-4 py-1 rounded-full border border-white/20 mb-4 text-sm font-medium tracking-wider">生命靈數：<span class="font-bold text-lg font-serif">${number}</span></div>
                        <h2 class="text-3xl font-serif font-bold mb-6 tracking-widest">${data.title}</h2>
                        <div class="grid grid-cols-2 gap-8 w-full mb-6">
                            <div class="text-center"><div class="opacity-60 text-xs mb-1">五行屬性</div><div class="text-2xl font-serif font-bold">${data.element}</div></div>
                            <div class="text-center"><div class="opacity-60 text-xs mb-1">對應體質</div><div class="text-xl font-bold">${data.constitution}</div></div>
                        </div>
                        <p class="text-center text-sm leading-relaxed opacity-95 mb-4">${data.desc}</p>
                    </div>
                    <div class="flex flex-col items-center gap-4 mt-8">
                        <div class="flex gap-4">
                            <button onclick="location.reload()" class="bg-white border px-6 py-3 rounded-full shadow-md text-stone-600 flex items-center gap-2 transition-all hover:bg-stone-50"><i data-lucide="refresh-cw" class="w-4 h-4"></i> 重選</button>
                            <button onclick="downloadShareImage()" id="download-btn" class="bg-stone-800 px-6 py-3 rounded-full shadow-md text-white flex items-center gap-2 transition-all hover:bg-stone-700"><i data-lucide="share-2" class="w-4 h-4"></i> 分享圖卡</button>
                        </div>
                        <p class="text-xs text-stone-400">點擊下載分享至 IG，找到你的合拍夥伴。</p>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        async function downloadShareImage() {
            if (!currentResult) return;
            const btn = document.getElementById('download-btn');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 處理中...`;
            lucide.createIcons();
            btn.disabled = true;

            try {
                // 渲染隱藏卡片
                renderExportCard(currentResult);
                const exportEl = document.getElementById('export-card');
                exportEl.classList.add('export-mode');

                // 等待字體載入
                if (document.fonts) await document.fonts.ready;
                await new Promise(r => setTimeout(r, 600));

                const canvas = await html2canvas(exportEl, {
                    scale: 2, useCORS: true, logging: false, width: 1080, height: 1920
                });

                canvas.toBlob(async (blob) => {
                    const userAgent = navigator.userAgent;
                    const isMobile = /iPhone|iPod|Android.*Mobile/i.test(userAgent);
                    const isSamsung = /Samsung|SM-|SAMSUNG/i.test(userAgent) || /SamsungBrowser/i.test(userAgent);
                    const file = new File([blob], "aliz-result.png", { type: "image/png" });

                    const fallbackDownload = () => {
                        const url = URL.createObjectURL(blob);
                        if (isMobile && isSamsung) {
                            window.open(url, '_blank');
                            setTimeout(() => URL.revokeObjectURL(url), 60000);
                        } else {
                            const a = document.createElement('a');
                            a.href = url; a.download = 'aliz-analysis.png';
                            document.body.appendChild(a); a.click(); document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        }
                    };

                    if (isMobile && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                        try { await navigator.share({ files: [file], title: '2026 年會五行分析' }); }
                        catch (e) { fallbackDownload(); }
                    } else {
                        fallbackDownload();
                    }
                    
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                    lucide.createIcons();
                }, 'image/png');
            } catch (err) {
                console.error(err);
                alert("產生圖片失敗，請重試");
                btn.innerHTML = originalHtml;
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        function renderExportCard(data) {
            const container = document.getElementById('export-card');
            container.className = `${data.color} text-white export-mode tabular-nums`;
            container.style.background = `linear-gradient(135deg, ${data.hex} 0%, ${data.darkHex} 100%)`;
            container.innerHTML = `
                <div class="flex flex-col items-center w-full">
                    <img src="${LOGO_URL}" class="h-[80px] brightness-0 invert mb-6">
                    <h2 class="text-[36px] font-light tracking-[0.4em] opacity-90 uppercase">2026 臺灣精油芳療年會</h2>
                </div>
                <div class="flex flex-col items-center gap-[60px] w-full">
                    <div class="flex items-center gap-8 px-12 py-6 rounded-full border-[3px] border-white/30 bg-white/10">
                        <span class="text-[44px]">生命靈數：<span class="font-bold text-[64px] font-serif">${data.number}</span></span>
                        <h1 class="text-[90px] font-serif font-bold tracking-widest pl-10 border-l border-white/30 leading-tight">${data.title}</h1>
                    </div>
                    <div class="flex justify-around w-full px-20">
                        <div class="text-center"><span class="opacity-80 text-[32px] mb-4 block tracking-widest">五行屬性</span><span class="text-[96px] font-serif font-bold">${data.element}</span></div>
                        <div class="text-center"><span class="opacity-80 text-[32px] mb-4 block tracking-widest">對應體質</span><span class="text-[80px] font-serif font-bold">${data.constitution}</span></div>
                    </div>
                </div>
                <div class="w-full p-16 bg-white/10 rounded-[60px] border-[3px] border-white/20">
                    <p class="text-center leading-[1.8] font-light text-[40px] opacity-95">${data.desc}</p>
                </div>
                <div class="flex flex-col gap-6 w-full">
                    <div class="bg-white/20 rounded-[80px] p-10 flex items-center gap-12 border-[3px] border-white/20">
                        <span class="text-[160px] font-serif font-bold">${data.partner.comp}</span>
                        <div class="flex flex-col gap-2">
                            <span class="bg-white text-stone-800 text-[28px] font-bold px-8 py-2 rounded-full w-fit tracking-widest uppercase">合拍夥伴</span>
                            <p class="text-[36px] font-medium tracking-wide">${data.partner.compDesc}</p>
                        </div>
                    </div>
                </div>
                <div class="text-[28px] font-light tracking-widest opacity-60">© 2026 Taiwan Aromatherapy Conference</div>
            `;
        }

        function incrementParticipant() {
            let count = parseInt(localStorage.getItem('aliz_visitors') || "0") + 1;
            localStorage.setItem('aliz_visitors', count);
            animateCounter(count);
        }

        function animateCounter(target) {
            const el = document.getElementById('participant-count');
            let start = 0;
            const step = () => {
                start += Math.ceil((target - start) / 10);
                if (start >= target) el.innerText = target.toLocaleString();
                else { el.innerText = start.toLocaleString(); requestAnimationFrame(step); }
            };
            requestAnimationFrame(step);
        }

        // --- Init ---

        window.addEventListener('DOMContentLoaded', () => {
            // 下拉選單初始化
            const yearSel = document.getElementById('year-select');
            const monthSel = document.getElementById('month-select');
            const daySel = document.getElementById('day-select');
            
            for (let i = 2024; i >= 1940; i--) yearSel.add(new Option(i, i));
            for (let i = 1; i <= 12; i++) monthSel.add(new Option(i.toString().padStart(2, '0'), i));
            for (let i = 1; i <= 31; i++) daySel.add(new Option(i.toString().padStart(2, '0'), i));

            // 手機選單切換
            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                document.getElementById('mobile-menu').classList.toggle('hidden');
            });

            // 線上展覽卡片
            const grid = document.getElementById('exhibition-grid');
            grid.innerHTML = EXHIBITION_DATA.map(item => `
                <div class="group relative overflow-hidden rounded-[2rem] h-[450px] cursor-pointer shadow-xl transition-all duration-500 hover:-translate-y-2 hover:shadow-2xl">
                    <img src="${item.imageUrl}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                    <div class="absolute inset-0 bg-gradient-to-t ${item.bgGradient} opacity-80 mix-blend-multiply group-hover:opacity-90 transition-opacity"></div>
                    <div class="absolute inset-0 p-8 flex flex-col justify-end text-white">
                        <span class="bg-white/20 backdrop-blur-md px-4 py-1 rounded-full text-xs font-bold w-fit mb-4 border border-white/10 uppercase tracking-widest">${item.tag}</span>
                        <h3 class="text-4xl font-serif font-bold mb-2 drop-shadow-md">${item.title}</h3>
                        <p class="text-white/80 text-lg mb-6 font-light">${item.subtitle}</p>
                        <button class="flex items-center gap-2 bg-white/20 backdrop-blur-md px-6 py-3 rounded-full w-fit hover:bg-white/40 transition-colors border border-white/20 group-hover:pl-8">
                            進入體驗 <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            // 計數器初始化
            animateCounter(parseInt(localStorage.getItem('aliz_visitors') || "2561"));

            // 滾動效果
            window.addEventListener('scroll', () => {
                const nav = document.getElementById('navbar');
                if (window.scrollY > 50) nav.classList.add('bg-stone-900/95', 'backdrop-blur-md', 'shadow-lg', 'py-3');
                else nav.classList.remove('bg-stone-900/95', 'backdrop-blur-md', 'shadow-lg', 'py-3');
            });

            lucide.createIcons();
        });

    </script>
</body>
</html>
